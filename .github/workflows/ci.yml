name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: owl_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # owl-server develops against the OWL core next to it (see [tool.uv.sources] in pyproject.toml)
      - uses: actions/checkout@v4
        with:
          path: owl-server
      - uses: actions/checkout@v4
        with:
          repository: MichaelWeissDEV/OWL
          path: OWL
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: owl-server
      - run: uv run ruff check .
        working-directory: owl-server
      - run: uv run ruff format --check .
        working-directory: owl-server
      - run: uv run mypy src
        working-directory: owl-server
      - name: Tests (SQLite)
        run: uv run pytest
        working-directory: owl-server
      - name: Tests (PostgreSQL, migrations included)
        run: uv run pytest
        working-directory: owl-server
        env:
          OWL_SERVER_TEST_POSTGRES_URL: postgresql://postgres:pw@localhost:5432/owl_server_test

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t owl-server:ci .
      - name: Start the compose stack and check health
        env:
          POSTGRES_PASSWORD: ci-password-0123456789
          OWL_SERVER_ADMIN_TOKEN: ci-admin-token-0123456789abcdef
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8765/api/v1/ready && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
