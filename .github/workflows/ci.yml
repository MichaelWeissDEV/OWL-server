name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: owl_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # owl-server develops against the OWL core next to it (see [tool.uv.sources] in pyproject.toml)
      - uses: actions/checkout@v4
        with:
          path: owl-server
      - uses: actions/checkout@v4
        with:
          repository: MichaelWeissDEV/OWL
          path: OWL
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: owl-server
      - run: uv run ruff check .
        working-directory: owl-server
      - run: uv run ruff format --check .
        working-directory: owl-server
      - run: uv run mypy src
        working-directory: owl-server
      - name: Tests (SQLite)
        run: uv run pytest
        working-directory: owl-server
      - name: Tests (PostgreSQL, migrations included)
        run: uv run pytest
        working-directory: owl-server
        env:
          OWL_SERVER_TEST_POSTGRES_URL: postgresql://postgres:pw@localhost:5432/owl_server_test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: owl-server
      - uses: actions/checkout@v4
        with:
          repository: MichaelWeissDEV/OWL
          path: OWL
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owl-server/dashboard/package-lock.json
      - run: uv sync
        working-directory: owl-server
      - run: npm ci
        working-directory: owl-server/dashboard
      - run: npm run lint
        working-directory: owl-server/dashboard
      - run: npm run typecheck
        working-directory: owl-server/dashboard
      - run: npm test
        working-directory: owl-server/dashboard
      - run: npm run build
        working-directory: owl-server/dashboard
      - name: Browser tests (real server + real browser)
        working-directory: owl-server/dashboard
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --only-group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t owl-server:ci .
      - name: Start the compose stack and check health
        env:
          POSTGRES_PASSWORD: ci-password-0123456789
        run: |
          docker compose --profile dashboard up -d --build
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8765/api/v1/ready && curl -fs http://127.0.0.1:8080/api/v1/health && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
