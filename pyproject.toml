[project]
name = "owl-server"
version = "0.1.0"
description = "OWL Server - a self-hostable, PostgreSQL-backed skill registry for OWL"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "owl",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "ldap3>=2.9.1",
]

[project.scripts]
owl-server = "owl_server.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "cryptography>=42"]

# Local development uses the sibling checkout of OWL (the shared core: data model, hashing,
# validation). Container and CI builds install owl from git instead (see Dockerfile).
[tool.uv.sources]
owl = { path = "../OWL", editable = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
