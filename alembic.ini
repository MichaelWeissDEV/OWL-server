# Developer convenience only (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The server itself builds its Alembic configuration in code (owl_server.db.alembic_config).
[alembic]
script_location = src/owl_server/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///dev.sqlite3
